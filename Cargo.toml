[package]
name = "rust-mc-bot"
version = "0.1.0"
authors = ["Eoghanmc22 <eoghanmc@icloud.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
debug = 2

[dependencies]
mio = { version = "1.2.3", features = ["os-poll", "net"] }
libdeflater = "1.26"
rand = "0.10.2"
# num_cpus = "1.16"
# flate2 = { version = "1.0.19", features = ["zlib"], default-features = false }

uuid = { version = "1.26.1", features = ["v4", "fast-rng"] }
